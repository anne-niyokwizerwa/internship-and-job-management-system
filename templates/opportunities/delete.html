{% extends "base.html" %}

{% block title %}Delete Opportunity{% endblock %}

{% block content %}
<section class="form-section">
    <div class="container">
        <h1>Delete Opportunity</h1>

        <p>
            Are you sure you want to delete
            <strong>{{ opportunity.title }}</strong>?
        </p>

        <form method="post">
            {% csrf_token %}

            <button type="submit" class="btn btn-danger">
                Yes, Delete
            </button>

            <a href="{% url 'company_dashboard' %}" class="btn btn-secondary">
                Cancel
            </a>
        </form>
    </div>
</section>
{% endblock %}
