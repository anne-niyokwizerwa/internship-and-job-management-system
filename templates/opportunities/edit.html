{% extends "base.html" %}

{% block title %}Edit Opportunity{% endblock %}

{% block content %}
<section class="form-section">
    <div class="container">
        <h1>Edit Opportunity</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit" class="btn btn-primary">
                Save Changes
            </button>

            <a href="{% url 'company_dashboard' %}">
                Cancel
            </a>
        </form>
    </div>
</section>
{% endblock %}
