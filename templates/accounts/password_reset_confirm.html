{% extends 'base.html' %}

{% block title %}Set a new password{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="form-container">
        <div class="form-header">
            <h2>Set a new password</h2>
        </div>

        <form method="post" class="auth-form">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary form-button">Change password</button>
        </form>
    </div>
</div>
{% endblock %}
