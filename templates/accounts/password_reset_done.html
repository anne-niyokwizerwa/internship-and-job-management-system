{% extends 'base.html' %}

{% block title %}Password reset sent{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="form-container">
        <div class="form-header">
            <h2>Password reset email sent</h2>
        </div>
        <p>We have sent a password reset link to your email address.</p>
        <p class="form-switch">
            <a href="{% url 'accounts:login' %}">Back to login</a>
        </p>
    </div>
</div>
{% endblock %}
